[package]
name = "anyecho"
version = "0.1.0"
edition = "2021"

[lib]
name = "anyecho_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "anyecho"
path = "src/main.rs"

[[bin]]
name = "ae"
path = "src/cli_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_Console",
] }

rayon = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
pinyin = "0.10"
regex = "1.10"
memmap2 = "0.9"
tantivy = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
bincode = "1.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }



[profile.release]
opt-level = "z"        # 极致体积优化 (Optimize for size)
lto = true             # 开启跨 Crate 链接时优化 (Full LTO)
codegen-units = 1      # 单代码生成单元，彻底消除死代码与冗余符号
panic = "abort"        # 移除栈展开异常表 (Stack unwinding)
strip = true           # 彻底剔除所有符号表与调试元数据 (Strip symbols)



